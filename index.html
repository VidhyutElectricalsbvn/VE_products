<style type="text/css">

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
}

/* HEADER */
.header {
  background-color: rgb(255, 255, 51);
  text-align: center;
  padding: 20px 20px 5px 20px;
  font-size: 28px;
  font-weight: bold;
  border: 1px solid black;
  border-bottom: none;
}

/* MOTTO */
.motto {
  background-color: rgb(255, 255, 51);
  text-align: center;
  padding: 5px 20px 15px 20px;
  font-size: 16px;
  font-style: italic;
  color: #333;
  border: 1px solid black;
  border-top: none;
  border-bottom: none;
}

/* MARQUEE */
.marquee-bar {
  background-color: rgb(255, 255, 51);
  padding: 10px;
  width: 100%;
  overflow: hidden;
  border: 1px solid black;
  border-top: none;
}

.marquee-bar marquee {
  font-size: 24px;
  font-weight: bold;
  color: red;
}

/* MAIN BODY */
.main-body {
  display: flex;
  flex-direction: row;
  background-color: rgb(51, 255, 255);
  border: 1px solid black;
  min-height: 500px;
}

/* NAV SIDEBAR */
.nav-sidebar {
  width: 180px;
  min-width: 140px;
  padding: 20px 14px;
  border-right: 2px solid black;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.nav-sidebar a {
  display: block;
  color: blue;
  text-decoration: underline;
  font-weight: bold;
  font-size: 15px;
  padding: 4px 0;
}

.nav-sidebar hr {
  border: none;
  border-top: 2px solid black;
  width: 80%;
  margin: 4px 0;
}

/* VIDEO AREA */
.video-area {
  flex: 1;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-area video {
  width: 100%;
  max-width: 900px;
  height: auto;
}

/* FOOTER */
.footer {
  background-color: #222;
  color: #fff;
  text-align: center;
  padding: 12px;
  font-size: 14px;
}

/* MOBILE */
@media (max-width: 768px) {

  .header {
    font-size: 20px;
    padding: 14px 14px 4px 14px;
  }

  .motto {
    font-size: 13px;
    padding: 4px 14px 10px 14px;
  }

  .marquee-bar marquee {
    font-size: 16px;
  }

  .main-body {
    flex-direction: column;
  }

  .nav-sidebar {
    width: 100%;
    flex-direction: row;
    flex-wrap: wrap;
    border-right: none;
    border-bottom: 2px solid black;
    padding: 10px;
    gap: 6px;
    align-items: center;
  }

  .nav-sidebar a {
    font-size: 13px;
    padding: 4px 8px;
  }

  .nav-sidebar hr {
    display: none;
  }

  .video-area {
    padding: 10px;
  }

  .footer {
    font-size: 12px;
    padding: 10px;
  }

}
